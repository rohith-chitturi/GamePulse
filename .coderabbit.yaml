# CodeRabbit Configuration for GamePulse
# EA Gameplay Services / DevOps Engineering Standards
language: "en-US"
tone_instructions: "Provide rigorous, professional, senior-level code review focusing on gameplay backend architecture, concurrency hazards, transaction isolation, reliability patterns (circuit breakers, timeouts, retries), error handling, and test fidelity."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
